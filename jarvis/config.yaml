# Jarvis runtime config. Env vars override (REDIS_URL, HA_URL, HA_TOKEN,
# OPENAI_API_KEY, ANTHROPIC_API_KEY, JARVIS_BRAIN_PROVIDER).

redis_url: redis://127.0.0.1:6379/0

router:
  fuzzy_threshold: 80
  routines_paths:
    - routines/default.yaml
    - routines/custom.yaml

brain:
  default_provider: openai
  timeout_seconds: 120
  providers:
    openai:
      provider: openai-api
      model: gpt-4.1
    local:
      provider: custom
      base_url: http://127.0.0.1:1234/v1
      model: qwen3.8-27b-3bit
    anthropic:
      provider: anthropic
      model: claude-sonnet-4-6

home_assistant:
  url: http://192.168.1.x:8123
  # token: pulled from HA_TOKEN env var
  confirm_domains:
    - lock
    - alarm_control_panel
    - cover
    - garage_door
  confirm_services:
    - lock.lock
    - lock.unlock
    - alarm_control_panel.alarm_arm_away
    - alarm_control_panel.alarm_disarm
    - cover.open_cover
    - cover.close_cover

weather:
  latitude: 43.2389
  longitude: 76.8897
  timezone: Asia/Almaty

display:
  enabled: true
  transport: wifi
  url: ws://jarvis-matrix.local/ws
  brightness_idle: 40
  brightness_active: 180

dashboard:
  host: 127.0.0.1
  port: 8088
