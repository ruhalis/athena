; PlatformIO project for Jarvis RGB matrix (ESP32-S3 + HUB75, WiFi WebSocket).
; Copy include/secrets.h.example to include/secrets.h before flashing.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  mrcodetastic/ESP32 HUB75 LED MATRIX PANEL DMA Display
  bblanchon/ArduinoJson@^7
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP
