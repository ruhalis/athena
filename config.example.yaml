# Portable Athena keys. Machine paths are set by scripts/bootstrap.sh,
# not stored here. Merge into ~/.hermes/config.yaml — do not replace the
# whole file.

model:
  default: gpt-5.6-luna
  provider: openai-api
  base_url: https://api.openai.com/v1

# Do not enable a fallback provider.

mcp_servers:
  linear:
    url: https://mcp.linear.app/mcp
    auth: oauth
    enabled: true
